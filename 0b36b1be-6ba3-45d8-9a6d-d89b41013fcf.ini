    $res_height = res_height
else
    $res_width = $window_width
    $res_height = $window_height
endif

[CommandListAddButton]
$Button_number = $Button_number + 1
if $Button_number <= $Button_amount
    run = CommandListButtonBlock
endif

[CommandListButtonBlock]
$Button_x = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off + (($x_size_Button + $gap) * (($Button_number - 1) % $Button_horizontal_max ) + $gap * 2)
$Button_y = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off + ((($y_size_Button + $gap)  * (($Button_number - 1) // $Button_horizontal_max) + $y_offset_button ) * res_width / res_height)

run = CommandListDrawButton
$ButtonLayerGeneration = !$ButtonLayerGeneration
run = CommandListDrawButton
if cursor_y > $Button_y && cursor_y < $Button_y + ($y_size_Button * res_width / res_height)
    if $Button_amount >= $Button_number
        if cursor_x > $Button_x && cursor_x < $Button_x + $x_size_Button
            if $mouse_clicked
                $Button_now = $Button_number
                run = CommandListSetButtonCondition
            endif
            run = CommandListDrawButtonEffect
        endif
    endif
endif

[CommandListCheckMouse]
$mouse_clicked = 0

if $is_dragging == 1
    if $mouse_hold
        run = CommandListMoveUIElement
    else
        $is_dragging = 0
    endif
else if cursor_x > $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off && cursor_x < $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off + $x_size
    if cursor_y > $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off && cursor_y < $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off + $y_size
        if $mouse_hold
            run = CommandListStartDrag
            run = CommandListMoveUIElement
        else
            $is_dragging = 0
        endif
    endif
endif

[CommandListDrawButtonEffect]
x87 = $x_size_Button
y87 = $y_size_Button * res_width / res_height
z87 = $Button_x
w87 = $Button_y
if $is_dragging && $Button_now == $Button_number
    w87 = $Button_y + $press_effect
endif
if $is_dragging == 0
    ps-t100 = ResourceUIButtonSelect
else
    ps-t100 = ResourceButtonPush
endif
run = CustomShaderElement

[CommandListDrawButton]
x87 = $x_size_Button
y87 = $y_size_Button * res_width / res_height
z87 = $Button_x
w87 = $Button_y
if $is_dragging && $Button_now == $Button_number
    w87 = $Button_y + $press_effect
endif
if $ButtonLayerGeneration
    ps-t100 = ResourceOutlineButton
else
    run = CommandListSetButtonIcon
endif
run = CustomShaderElement

[CommandListDrawUIHelp]
x87 = 0.32
y87 = 0.54
z87 = 0.033
w87 = 0.22
ps-t100 = ResourceHelp
run = CustomShaderElement

[CommandListDrawUICorner]
x87 = $x_size*2.5
y87 = x87 * (16/9)
z87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off-$x_size*0.86
w87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off-$x_size * (16/9) *1.0165
ps-t100 = ResourceCorner
run = CustomShaderElement

[CommandListDrawUICorner2]
x87 = $x_size*2.5
y87 = x87 * (16/9)
z87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off-$x_size*0.86
w87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off-$x_size * (16/9) *1.0165
ps-t100 = ResourceCorner2
run = CustomShaderElement

[CommandListDrawUIElement]
x87 = $x_size
y87 = $y_size
z87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off
w87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off
ps-t100 = ResourceUIBackground
run = CustomShaderElement

[CommandListDrawUITitle]
x87 = $x_Title_size
y87 = $y_Title_size
z87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off+$x_Title_size * 0.202
w87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off
ps-t100 = ResourceUITitle
run = CustomShaderElement

[CommandListDrawUICredit]
x87 = $x_Credit_size
y87 = $y_Credit_size
z87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off + $x_size - $x_Credit_size*1.07
w87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off + ($y_size - $y_Credit_size)*0.855
ps-t100 = ResourceUICredit
run = CustomShaderElement

[CommandListDrawUIBorderXUpper]
x87 = $x_size
y87 = $UI_Thickness * res_width / res_height * 14
z87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off
w87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off - $UI_Thickness * res_width / res_height * 14
ps-t100 = ResourceBU
run = CustomShaderElement

[CommandListDrawUIBorderXLower]
x87 = 0
y87 = $UI_Thickness * res_width / res_height
z87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off
w87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off + $y_size - $UI_Thickness
ps-t100 = ResourceUIColorBorder
run = CustomShaderElement

[CommandListDrawUIBorderXMiddle]
x87 = $x_size
y87 = $UI_Thickness * res_width / res_height*2.2
z87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off
w87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off + $y_Title_size - $UI_Thickness*0.41
ps-t100 = ResourceBT
run = CustomShaderElement

[CommandListDrawUIBorderXMiddle2]
x87 = 0
y87 = $UI_Thickness * res_width / res_height
z87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off
w87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off + $y_size - $y_Credit_size - $UI_Thickness
ps-t100 = ResourceUIColorBorder
run = CustomShaderElement

[CommandListDrawUIBorderYLeft]
x87 = $UI_Thickness * 14
y87 = $y_size
z87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off - $UI_Thickness * 14
w87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off
ps-t100 = ResourceBL
run = CustomShaderElement

[CommandListDrawUIBorderYRight]
x87 = $UI_Thickness * 14
y87 = $y_size
z87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off + $x_size 
w87 = $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off
ps-t100 = ResourceBR
run = CustomShaderElement

[CommandListStartDrag]
if $is_dragging == 0
    $drag_start_x = cursor_x - $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off
    $drag_start_y = cursor_y - $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off
    $is_dragging = 1
endif

[CommandListMoveUIElement]
if $is_dragging == 1
    if $mouse_hold
        $new_x_off = cursor_x - $drag_start_x
        $new_y_off = cursor_y - $drag_start_y

        if $new_x_off < 0
            $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off = 0
        else if $new_x_off + $x_size > 1
            $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off = 1 - $x_size
        else
            $\QAQM\Persist\Bridge_cd0f81622ecd\final_x_off = $new_x_off
        endif

        if $new_y_off < 0
            $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off = 0
        else if $new_y_off + $y_size > 1
            $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off = 1 - $y_size
        else
            $\QAQM\Persist\Bridge_cd0f81622ecd\final_y_off = $new_y_off
        endif
    else
        $is_dragging = 0
    endif
endif

[CommandListDrawHelpUIBorderXLower]
x87 = $x_size_help
y87 = $UI_Thickness * res_width / res_height
z87 = $final_x_off_help
w87 = $final_y_off_help + $y_size_help - $UI_Thickness
ps-t100 = ResourceUIColorBorder
run = CustomShaderElement

[CommandListDrawHelpUIBorderYLeft]
x87 = $UI_Thickness
y87 = $y_size_help
z87 = $final_x_off_help
w87 = $final_y_off_help
ps-t100 = ResourceUIColorBorder
run = CustomShaderElement

[CommandListDrawHelpUIBorderYRight]
x87 = $UI_Thickness
y87 = $y_size_help
z87 = $final_x_off_help + $x_size_help - $UI_Thickness
w87 = $final_y_off_help
ps-t100 = ResourceUIColorBorder
run = CustomShaderElement

[CommandListDrawCornerImage]
x87 = $corner_x
y87 = $corner_y
z87 = $corner_w
w87 = $corner_h
ps-t100 = ResourceCornerImage
run = CustomShaderElement

