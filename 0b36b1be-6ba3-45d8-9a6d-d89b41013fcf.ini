global $active8
global $active9

; === 發光淫紋變數 ===
global $dt
global $ts
global $glow_phase = 0.0
global $glow_dir = 1.0
global $glow_val = 0.0

; Persisted state is hosted by qaqm_state_cd0f81622ecd.ini
[Present]
post $active0 = 0
post $active1 = 0
post $active2 = 0
post $active3 = 0
post $active4 = 0
post $active5 = 0
post $active6 = 0
post $active7 = 0
post $active8 = 0
post $active9 = 0

; === 平滑呼吸燈運算邏輯 ===
$dt = time - $ts
$ts = time

$glow_phase = $glow_phase + ($glow_dir * 0.4 * $dt)
if $glow_phase >= 1.0
    $glow_phase = 1.0
    $glow_dir = -1.0
endif
if $glow_phase <= 0.0
    $glow_phase = 0.0
    $glow_dir = 1.0
endif

local $temp = 3.0 - (2.0 * $glow_phase)
local $wave = $glow_phase * $glow_phase * $temp
$glow_val = 1 + ($wave * 10.0)
; ==========================

; === 發光貼圖應用 CommandList ===
